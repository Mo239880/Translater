<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法小助手</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #ffe6f2; display: flex; justify-content: center; padding: 20px; }
.box { width: 100%; max-width: 600px; background: #fff; border-radius: 15px; padding: 20px; border: 2px solid #ffb6c1; }
h2 { text-align: center; color: #ff69b4; margin-bottom: 15px; font-size: 20px; }
select, input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ffb6c1; font-size: 16px; }
button { background: #ff9a9e; color: #fff; font-weight: bold; border: none; }
button:active { background: #ff69b4; }
.card { background: #fff9fb; border: 1px dashed #ffb6c1; padding: 15px; margin-top: 10px; border-radius: 10px; display: none; }
.card.show { display: block; }
.error { color: #ff1493; font-size: 14px; text-align: center; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
    <h2>👑 词源小公主 🎀</h2>
    <select id="lang1">
        <option value="it">🇮🇹 意大利语</option>
        <option value="en">🇬🇧 英语</option>
    </select>
    <input type="text" id="word" placeholder="输入单词 (试试 fecce)...">
    <button id="btnEty">🪄 查词源</button>
    <div id="etyError" class="error"></div>
    <div id="etyCard" class="card"><p id="etyText"></p></div>

    <hr style="border:0; border-top:1px dashed #ffb6c1; margin:20px 0;">

    <h2>🌍 魔法翻译机</h2>
    <select id="srcLang">
        <option value="it">🇮🇹 意大利语</option>
        <option value="zh-CN">🇨🇳 中文</option>
    </select>
    <select id="tgtLang">
        <option value="zh-CN">🇨🇳 中文</option>
        <option value="it">🇮🇹 意大利语</option>
    </select>
    <input type="text" id="transInput" placeholder="输入要翻译的内容...">
    <button id="btnTrans">✨ 立即翻译</button>
    <div id="transError" class="error"></div>
    <div id="transCard" class="card"><p id="transText"></p></div>
</div>

<script>
// 查词源
document.getElementById('btnEty').onclick = async function() {
    let word = document.getElementById('word').value.trim().toLowerCase();
    let lang = document.getElementById('lang1').value;
    let err = document.getElementById('etyError');
    let card = document.getElementById('etyCard');
    let txt = document.getElementById('etyText');

    err.innerText = ''; card.classList.remove('show');
    if(!word) { err.innerText = '请输入单词！'; return; }

    // 强制本地词源（为了让 fecce 马上出结果）
    if(lang === 'it' && word === 'fecce') {
        txt.innerText = "【智能推演原形: feccia】\n\n源自拉丁语 'faex'（沉淀物、渣滓）。在意大利语中演变为 'feccia'，复数形式为 'fecce'，指代酒糟或渣滓。";
        card.classList.add('show');
        return;
    }

    try {
        let url = 'https://' + lang + '.wiktionary.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=' + word + '&format=json&origin=*';
        let res = await fetch(url);
        let data = await res.json();
        let pages = data.query.pages;
        let id = Object.keys(pages)[0];

        if(id === "-1") { err.innerText = "词库找不到这个词哦~"; return; }
        
        let text = pages[id].extract;
        let match = text.match(/(Etimologia|Etymology)[\s\S]{0,300}/i);
        
        if(match) {
            txt.innerText = match[0].substring(0, 250) + "...";
            card.classList.add('show');
        } else {
            err.innerText = "这个词没有记录词源哦，请查原形。";
        }
    } catch(e) { err.innerText = "网络错误"; }
};

// 翻译
document.getElementById('btnTrans').onclick = async function() {
    let text = document.getElementById('transInput').value.trim();
    let src = document.getElementById('srcLang').value.split('-')[0];
    let tgt = document.getElementById('tgtLang').value.split('-')[0];
    let err = document.getElementById('transError');
    let card = document.getElementById('transCard');
    let txt = document.getElementById('transText');

    err.innerText = ''; card.classList.remove('show');
    if(!text) { err.innerText = '请输入内容！'; return; }

    try {
        let url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + src + '&tl=' + tgt + '&dt=t&q=' + encodeURIComponent(text);
        let res = await fetch(url);
        let data = await res.json();
        let result = '';
        if(data && data[0]) { data[0].forEach(i => { if(i[0]) result += i[0]; }); }
        
        if(result) { txt.innerText = result; card.classList.add('show'); }
        else { err.innerText = '翻译失败'; }
    } catch(e) { err.innerText = "网络错误"; }
};
</script>
</body>
</html>
