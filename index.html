<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9国语言实时同传</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1e272e; color: #d2dae2; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
        h1 { text-align: center; color: #fff; font-size: 24px; margin-bottom: 5px; }
        
        .controls { background: #485460; padding: 15px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        select { padding: 10px; border-radius: 8px; border: none; font-size: 15px; background: #d2dae2; color: #1e272e; font-weight: bold; outline: none; cursor: pointer; }
        .arrow { font-size: 20px; color: #ffa801; font-weight: bold; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        #startBtn { background: #0be881; color: #1e272e; }
        #startBtn.active { background: #ff3f34; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .toggle-container { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; color: white; margin-left: 10px; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

        .text-box { background: #f5f6fa; color: #2f3640; padding: 20px; border-radius: 12px; min-height: 100px; font-size: 18px; line-height: 1.5; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .label { position: absolute; top: -12px; left: 15px; background: #05c46b; color: white; padding: 2px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .text-box.translated { background: #dff9fb; }
        .text-box.translated .label { background: #7d5fff; }
        
        .status { text-align: center; color: #ffa801; font-weight: bold; min-height: 24px; font-size: 14px; }
        
        @media (max-width: 600px) {
            .controls { flex-direction: column; }
            .arrow { transform: rotate(90deg); }
            select, button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎙️ 9国语言实时同传</h1>
    <div class="status" id="statusText">准备就绪，请点击开始</div>
    
    <div class="controls">
        <select id="sourceLang">
            <option value="zh-CN">中文</option>
            <option value="en-US" selected>英语</option>
            <option value="it-IT">意大利语</option>
            <option value="es-ES">西班牙语</option>
            <option value="de-DE">德语</option>
            <option value="fr-FR">法语</option>
            <option value="da-DK">丹麦语</option>
            <option value="fi-FI">芬兰语</option>
            <option value="no-NO">挪威语</option>
        </select>
        
        <span class="arrow">➡️</span>
        
        <select id="targetLang">
            <option value="zh-CN">中文</option>
            <option value="en-US">英语</option>
            <option value="it-IT" selected>意大利语</option>
            <option value="es-ES">西班牙语</option>
            <option value="de-DE">德语</option>
            <option value="fr-FR">法语</option>
            <option value="da-DK">丹麦语</option>
            <option value="fi-FI">芬兰语</option>
            <option value="no-NO">挪威语</option>
        </select>

        <button id="startBtn">▶ 开始聆听</button>
        
        <label class="toggle-container">
            <input type="checkbox" id="voiceToggle" checked>
            朗读结果
        </label>
    </div>

    <div class="text-box">
        <span class="label">识别原文</span>
        <div id="sourceText" style="color: #747d8c;">...</div>
    </div>

    <div class="text-box translated">
        <span class="label">翻译结果</span>
        <div id="translatedText" style="color: #747d8c;">...</div>
    </div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("您的浏览器不支持语音识别！请使用 Google Chrome 或 Microsoft Edge 浏览器打开。");
        document.getElementById('startBtn').disabled = true;
    }

    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('statusText');
    const sourceTextDiv = document.getElementById('sourceText');
    const translatedTextDiv = document.getElementById('translatedText');
    const sourceLangSelect = document.getElementById('sourceLang');
    const targetLangSelect = document.getElementById('targetLang');
    const voiceToggle = document.getElementById('voiceToggle');

    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true; 
        recognition.interimResults = true; 

        recognition.onstart = () => {
            isListening = true;
            startBtn.textContent = "⏹ 停止聆听";
            startBtn.classList.add('active');
            statusText.textContent = "🟢 正在聆听中... 请对着麦克风说话";
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
                statusText.textContent = "❌ 麦克风权限被拒绝，请允许后刷新重试。";
            } else {
                statusText.textContent = "⚠️ 发生错误: " + event.error;
            }
            stopListening();
        };

        recognition.onend = () => {
            if (isListening) {
                recognition.start(); // 防止长时间不说话断开
            } else {
                startBtn.textContent = "▶ 开始聆听";
                startBtn.classList.remove('active');
                statusText.textContent = "🔴 已停止";
            }
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            if (finalTranscript || interimTranscript) {
                sourceTextDiv.textContent = finalTranscript || interimTranscript;
                sourceTextDiv.style.color = "#2f3640";
            }

            if (finalTranscript) {
                translateAndSpeak(finalTranscript);
            }
        };
    }

    // 核心翻译函数
    async function translateAndSpeak(text) {
        // 获取下拉框的语言代码（如 'zh-CN', 'it-IT'）
        const sourceLang = sourceLangSelect.value;
        const targetLang = targetLangSelect.value;

        // 如果选的语言一样，就不翻译了
        if (sourceLang === targetLang) {
            translatedTextDiv.textContent = text;
            translatedTextDiv.style.color = "#2f3640";
            if (voiceToggle.checked) speakText(text, targetLang);
            return;
        }

        statusText.textContent = "⏳ 正在飞速翻译...";

        try {
            // 使用 Google 翻译的免费接口
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang.split('-')[0]}&tl=${targetLang.split('-')[0]}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            const data = await response.json();
            
            // 解析返回的数据结构
            let translatedText = '';
            if (data && data[0]) {
                data[0].forEach(item => {
                    if (item[0]) translatedText += item[0];
                });
            }

            if (translatedText) {
                translatedTextDiv.textContent = translatedText;
                translatedTextDiv.style.color = "#2f3640";
                
                if (voiceToggle.checked) {
                    speakText(translatedText, targetLang);
                }
                statusText.textContent = "🟢 正在聆听中... 请继续";
            } else {
                throw new Error("未获取到翻译结果");
            }

        } catch (error) {
            console.error("翻译失败", error);
            statusText.textContent = "❌ 翻译接口抽风了，请再说一次";
        }
    }

    // 语音合成函数
    function speakText(text, lang) {
        window.speechSynthesis.cancel(); // 打断上一句
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 1.0; 
        window.speechSynthesis.speak(utterance);
    }

    startBtn.onclick = () => {
        if (isListening) {
            stopListening();
        } else {
            recognition.lang = sourceLangSelect.value; // 设置识别语言
            recognition.start();
        }
    };

    function stopListening() {
        isListening = false;
        if (recognition) recognition.stop();
        startBtn.textContent = "▶ 开始聆听";
        startBtn.classList.remove('active');
        statusText.textContent = "🔴 已停止";
    }
</script>

</body>
</html>
