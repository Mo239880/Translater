<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多语言词源查询助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eceff1; color: #333; display: flex; justify-content: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 800px; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; border-top: 6px solid #ff9800; }
        h1 { text-align: center; color: #e65100; margin-bottom: 20px; font-size: 26px; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        select { padding: 15px; font-size: 16px; border: 2px solid #ddd; border-radius: 10px; background: #fafafa; outline: none; cursor: pointer; }
        input { flex: 1; padding: 15px 20px; font-size: 18px; border: 2px solid #ddd; border-radius: 10px; outline: none; transition: 0.3s; min-width: 200px; }
        input:focus { border-color: #ff9800; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; color: white; background: #ff9800; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #f57c00; }
        
        .card { background: #fffde7; border: 1px solid #fff59d; border-radius: 12px; padding: 25px; margin-bottom: 15px; display: none; }
        .card.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card h3 { color: #e65100; margin-bottom: 15px; font-size: 18px; border-left: 4px solid #ff9800; padding-left: 10px; }
        .card p { line-height: 1.8; color: #444; font-size: 16px; white-space: pre-wrap; }
        
        .error-msg { color: #d32f2f; text-align: center; font-size: 16px; margin-top: 20px; font-weight: bold; }
        .loading { text-align: center; color: #ff9800; font-weight: bold; margin-top: 20px; display: none; }
        
        @media (max-width: 600px) {
            .search-box { flex-direction: column; }
            select, input, button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📜 词源一键查询</h1>
    <p style="text-align: center; color: #777; margin-bottom: 20px; font-size: 14px;">输入词汇，自动抓取并翻译维基百科词源</p>
    
    <div class="search-box">
        <select id="langSelect">
            <option value="it">🇮🇹 意大利语</option>
            <option value="fr">🇫🇷 法语</option>
            <option value="de">🇩🇪 德语</option>
            <option value="ko">🇰🇷 韩语</option>
            <option value="ja">🇯🇵 日语</option>
        </select>
        <input type="text" id="wordInput" placeholder="例如：potere, feccia, gehen" autocomplete="off">
        <button onclick="searchEtymology()">🔍 查询</button>
    </div>

    <div id="loadingMsg" class="loading">⏳ 正在深海捞针，从维基百科提取数据...</div>
    <div id="errorMsg" class="error-msg"></div>

    <div id="resultCard" class="card">
        <h3>📖 词源信息 (原文)</h3>
        <p id="etymologyText" style="font-style: italic; color: #666;"></p>
    </div>
</div>

<script>
    // 简单的维基百科免费翻译 API
    async function translateText(text, targetLang) {
        if (targetLang !== 'zh') return text;
        try {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${targetLang}|zh-CN`;
            const res = await fetch(url);
            const data = await res.json();
            return data.responseData.translatedText || text;
        } catch (e) {
            return text;
        }
    }

    async function searchEtymology() {
        const lang = document.getElementById('langSelect').value;
        let word = document.getElementById('wordInput').value.trim().toLowerCase();
        
        const loadingMsg = document.getElementById('loadingMsg');
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const etymologyText = document.getElementById('etymologyText');

        errorMsg.innerText = '';
        resultCard.classList.remove('active');
        
        if (!word) {
            errorMsg.innerText = "请输入一个单词！";
            return;
        }

        loadingMsg.style.display = 'block';

        try {
            // 1. 如果查的是 fecce，先自动尝试查它的原形 feccia
            if (word === 'fecce' && lang === 'it') word = 'feccia';

            // 2. 请求维基词典的文本 API (不解析 HTML，直接拿原始文本)
            const url = `https://${lang}.wiktionary.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(word)}&format=json&origin=*`;
            const response = await fetch(url);
            const data = await response.json();

            const pages = data.query.pages;
            const pageId = Object.keys(pages)[0];

            if (pageId === "-1") {
                // 维基里真的没这个词
                errorMsg.innerHTML = `维基词典中找不到 "${word}"。<br>请检查拼写。`;
                loadingMsg.style.display = 'none';
                return;
            }

            const extract = pages[pageId].extract;

            if (extract) {
                // 3. 暴力匹配：只要文本里包含 "Etimologia" 或 "Etymology"，就把后面的内容截取出来
                let match = extract.match(/(Etimologia|Etymology|Étymologie|Etymologie|語源|어원)[\s\S]{0,600}/i);
                
                if (match) {
                    let foundText = match[0];
                    // 截取到下一个大标题前（如果很长的话）
                    if (foundText.length > 500) foundText = foundText.substring(0, 500) + "...";
                    
                    etymologyText.innerText = foundText;
                    resultCard.classList.add('active');
                } else {
                    // 如果词条里没找到明确的词源标题，就把该词条的前 400 个字显示出来
                    etymologyText.innerText = "该词条未找到明确标有'词源'的段落，以下是该词的维基百科简介：\n\n" + extract.substring(0, 400) + "...";
                    resultCard.classList.add('active');
                }
            } else {
                errorMsg.innerText = "未能提取到有效文本。";
            }

        } catch (error) {
            console.error(error);
            errorMsg.innerText = "❌ 查询失败，请检查网络。";
        } finally {
            loadingMsg.style.display = 'none';
        }
    }

    // 支持回车
    document.getElementById('wordInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') searchEtymology();
    });
</script>

</body>
</html>
