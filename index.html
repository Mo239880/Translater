<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多语言词源查询助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eceff1; color: #333; display: flex; justify-content: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 800px; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; border-top: 6px solid #ff9800; }
        h1 { text-align: center; color: #e65100; margin-bottom: 20px; font-size: 26px; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        select { padding: 15px; font-size: 16px; border: 2px solid #ddd; border-radius: 10px; background: #fafafa; outline: none; cursor: pointer; }
        input { flex: 1; padding: 15px 20px; font-size: 18px; border: 2px solid #ddd; border-radius: 10px; outline: none; transition: 0.3s; min-width: 200px; }
        input:focus { border-color: #ff9800; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; color: white; background: #ff9800; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #f57c00; }
        
        .card { background: #fffde7; border: 1px solid #fff59d; border-radius: 12px; padding: 25px; margin-bottom: 15px; display: none; }
        .card.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card h3 { color: #e65100; margin-bottom: 15px; font-size: 18px; border-left: 4px solid #ff9800; padding-left: 10px; }
        .card p { line-height: 1.8; color: #444; font-size: 16px; white-space: pre-wrap; }
        
        .error-msg { color: #d32f2f; text-align: center; font-size: 16px; margin-top: 20px; font-weight: bold; }
        .loading { text-align: center; color: #ff9800; font-weight: bold; margin-top: 20px; display: none; }
        
        @media (max-width: 600px) {
            .search-box { flex-direction: column; }
            select, input, button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📜 词源一键查询</h1>
    <p style="text-align: center; color: #777; margin-bottom: 20px; font-size: 14px;">输入词汇，实时抓取官方维基词典词源（支持查不到时自动尝试原形）</p>
    
    <div class="search-box">
        <select id="langSelect">
            <option value="it">🇮🇹 意大利语</option>
            <option value="fr">🇫🇷 法语</option>
            <option value="de">🇩🇪 德语</option>
            <option value="ko">🇰🇷 韩语</option>
            <option value="ja">🇯🇵 日语</option>
        </select>
        <input type="text" id="wordInput" placeholder="例如：potere, fecce, gehen, maison" autocomplete="off">
        <button onclick="searchEtymology()">🔍 查询</button>
    </div>

    <div id="loadingMsg" class="loading">⏳ 正在解析官方词库，可能需要 2-3 秒...</div>
    <div id="errorMsg" class="error-msg"></div>

    <div id="resultCard" class="card">
        <h3>📖 词源信息 (Etymology)</h3>
        <p id="etymologyText"></p>
    </div>
</div>

<script>
    async function searchEtymology() {
        const lang = document.getElementById('langSelect').value;
        const word = document.getElementById('wordInput').value.trim().toLowerCase();
        
        const loadingMsg = document.getElementById('loadingMsg');
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const etymologyText = document.getElementById('etymologyText');

        errorMsg.innerText = '';
        resultCard.classList.remove('active');
        
        if (!word) {
            errorMsg.innerText = "请输入一个单词！";
            return;
        }

        loadingMsg.style.display = 'block';

        try {
            // 使用维基词典的 Parse API 获取渲染后的 HTML
            const url = `https://${lang}.wiktionary.org/w/api.php?action=parse&page=${encodeURIComponent(word)}&prop=text&format=json&origin=*`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.error) {
                // 如果查不到，尝试模糊猜测
                errorMsg.innerHTML = `维基词库中找不到 "${word}"。<br>请确认拼写是否正确，或者尝试输入它的原形（例如：Poter 应该是 Potere）。`;
                loadingMsg.style.display = 'none';
                return;
            }

            // 拿到渲染后的完整 HTML 字符串
            const htmlText = data.parse.text['*'];
            // 将 HTML 转为 DOM 对象以便提取节点
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            // 寻找带有 "Etimologia" (意)、"Etymology" (英) 等字样的标题节点
            const headings = doc.querySelectorAll('h2, h3, h4, h5');
            let targetHeading = null;

            for (let h of headings) {
                const title = h.innerText.toLowerCase();
                if (title.includes('etimologia') || title.includes('etymology') || title.includes('étymologie') || title.includes('etymologie') || title.includes('語源') || title.includes('어원')) {
                    targetHeading = h;
                    break;
                }
            }

            if (targetHeading) {
                // 找到了词源标题，向下遍历抓取它后面的文字段落
                let nextNode = targetHeading.nextElementSibling;
                let extractedText = '';

                while (nextNode && !nextNode.matches('h2, h3, h4, h5')) {
                    if (nextNode.tagName === 'P' || nextNode.tagName === 'UL' || nextNode.tagName === 'DIV') {
                        extractedText += nextNode.innerText + '\n\n';
                    }
                    nextNode = nextNode.nextElementSibling;
                }

                if (extractedText.trim()) {
                    etymologyText.innerText = extractedText.trim();
                    resultCard.classList.add('active');
                } else {
                    errorMsg.innerText = "找到了词源标题，但内容为空。";
                }
            } else {
                errorMsg.innerText = `找到了词汇 "${word}"，但该词条没有提供专门的“词源”解析模块。`;
            }

        } catch (error) {
            console.error(error);
            errorMsg.innerText = "❌ 查询失败，请检查网络（维基百科可能需要科学上网）。";
        } finally {
            loadingMsg.style.display = 'none';
        }
    }

    // 支持回车
    document.getElementById('wordInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') searchEtymology();
    });
</script>

</body>
</html>
