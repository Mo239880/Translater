<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法小助手</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; background: #ffe6f2; background-image: radial-gradient(#ffb6c1 1px, transparent 1px); background-size: 20px 20px; color: #5a3d4d; display: flex; justify-content: center; padding: 20px 10px; min-height: 100vh; }
.box { width: 100%; max-width: 600px; background: #ffffff; border-radius: 20px; box-shadow: 0 5px 20px rgba(255,105,180,0.3); padding: 20px; border: 3px solid #ffb6c1; }
h2 { text-align: center; color: #ff69b4; font-size: 20px; margin-bottom: 15px; }
.input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
select, input, button { padding: 12px; font-size: 16px; border: 2px solid #ffb6c1; border-radius: 12px; outline: none; background: #fffafa; color: #d63384; font-weight: bold; }
button { background: linear-gradient(135deg, #ff9a9e, #fecfef); color: white; cursor: pointer; text-shadow: 1px 1px 1px rgba(0,0,0,0.1); border: none; }
button:active { transform: scale(0.98); }
.card { background: #fff9fb; border: 2px dashed #ffb6c1; border-radius: 15px; padding: 15px; margin-top: 15px; display: none; }
.card.show { display: block; }
.error { color: #ff1493; text-align: center; font-size: 14px; margin-top: 10px; font-weight: bold; }
.divider { text-align: center; color: #ffb6c1; font-size: 20px; margin: 20px 0; }
</style>
</head>
<body>
<div class="box">
    <h2> 词源 🎀</h2>
    <div class="input-group">
        <select id="lang1">
            <option value="it">🇮🇹 意大利语</option>
            <option value="en">🇬🇧 英语</option>
            <option value="="fr">🇫🇷 get法语</option>
            <option value="de">🇩🇪 德语</option>
            <option value="ko">🇰🇷 韩语</option>
            <option value="ja">🇯🇵 日语</option>
        </select>
        <input type="text" id="word" placeholder="输入单词查词源...">
        <button onclickEtymology()">🪄 查词源</button>
    </div>
    <div id="etyError" class="error"></div>
    <div id="etyCard" class="card"><p id="etyText" style="line-height:1.6;"></p></div>

    <div class="divider">✨ ✨ ✨</div>

    <h2>🌍 魔法翻译机</h2>
    <div class="input-group">
        <select id="srcLang">
            <option value="zh-CN">🇨🇳 中文</option>
            <option value="en">🇬🇧 英语</option>
            <option value="it">🇮🇹 意大利语</option>
            <option value="ja">🇯🇵 日语</option>
            <option value="ko">🇰🇷 韩语</option>
            <option value="fr">🇫🇷 法语</option>
            <option value="de">🇩🇪 德语</option>
            <option value="es">🇪🇸 西班牙语</option>
            <option value="da">🇩🇰 丹麦语</option>
        </select>
        <select id="tgtLang">
            <option value="it">🇮🇹 意大利语</option>
            <option value="zh-CN">🇨🇳 中文</option>
            <option value="en">🇬🇧 英语</option>
            <option value="ja">🇯🇵 日语</option>
            <option value="ko">🇰🇷 韩语</option>
            <option value="fr">🇫🇷 法语</option>
            <option value="de">🇩🇪 德语</option>
            <option value="es">🇪🇸 西班牙语</option>
            <option value="da">🇩🇰 丹麦语</option>
        </select>
        <input type="text" id="transInput" placeholder="输入要翻译的内容...">
        <button onclick="doTranslate()">✨ 立即翻译</button>
    </div>
    <div id="transError" class="error"></div>
    <div id="transCard" class="card"><p id="transText" style="line-height:1.6;"></p></div>
</div>

<script>
// 查词源功能
async function getEtymology() {
    let word = document.getElementById('word').value.trim().toLowerCase();
    let lang = document.getElementById('lang1').value;
    let etyError = document.getElementById('etyError');
    let etyCard = document.getElementById('etyCard');
    let etyText = document.getElementById('etyText');
    
    etyError.innerText = '';
    etyCard.classList.remove('show');
    if (!word) { etyError.innerText = "请输入单词哦！"; return; }

    try {
        let url = 'https://' + lang + '.wiktionary.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=' + encodeURIComponent(word) + '&format=json&origin=*';
        let res = await fetch(url);
        let data = await res.json();
        let pages = data.query.pages;
        let id = Object.keys(pages)[0];

        if (id === "-1") { etyError.innerText = "词库里找不到这个词哦~"; return; }

        let text = pages[id].extract;
        if (text) {
            let match = text.match(/(Etimologia|Etymology|Étymologie|Etymologie|語源|어원)[\s\S]{0,400}/i);
            if (match) {
                etyText.innerText = match[0].substring(0, 350) + "...";
            } else {
                etyText.innerText = "这个词没有记录词源哦~";
            }
            etyCard.classList.add('show');
        }
    } catch (e) {
        etyError.innerText = "网络有点卡，请重试。";
    }
}

// 翻译功能
async function doTranslate() {
    let text = document.getElementById('transInput').value.trim();
    let src = document.getElementById('srcLang').value.split('-')[0];
    let tgt = document.getElementById('tgtLang').value.split('-')[0];
    let transError = document.getElementById('transError');
    let transCard = document.getElementById('transCard');
    let transText = document.getElementById('transText');

    transError.innerText = '';
    transCard.classList.remove('show');
    if (!text) { transError.innerText = "请输入要翻译的内容！"; return; }

    try {
        let url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + src + '&tl=' + tgt + '&dt=t&q=' + encodeURIComponent(text);
        let res = await fetch(url);
        let data = await res.json();
        
        let result = '';
        if (data && data[0]) {
            data[0].forEach(item => { if (item[0]) result += item[0]; });
        }
        
        if (result) {
            transText.innerText = result;
            transCard.classList.add('show');
        } else {
            transError.innerText = "翻译失败，请重试。";
        }
    } catch (e) {
        transError.innerText = "网络异常，翻译失败。";
    }
}
</script>
</body>
</html>
